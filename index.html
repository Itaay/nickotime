<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Nothing may be sent anywhere except map requests to OpenStreetMap (tiles, and street data for an area). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org https://overpass-api.de; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Nickotime</title>
<meta name="description" content="Pace your walk or ride to catch green lights. Works offline, data stays on your phone.">
<meta name="theme-color" content="#0e1726">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header id="top">
  <a id="brand" class="brand" href="#/go"></a>
  <button id="settings-btn" class="icon" data-act="nav:settings"></button>
</header>
<main id="main"></main>
<div id="mapwrap">
  <div id="map"></div>
  <div class="cross" aria-hidden="true"></div>
  <div id="pickbar"></div>
  <div id="mapfabs" class="fabs"></div>
</div>
<nav id="tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
